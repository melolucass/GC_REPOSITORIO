services:
    api:
        build:
            context: .
            target: development
        restart: always
        env_file:
            - ./.env
        environment:
            MYSQL_HOST: db
        ports:
            - "${HOST_PORT}:${PORT}"
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - .:/app
            - /app/node_modules
    db:
        image: mysql:9.7
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
            MYSQL_DATABASE: "${MYSQL_DATABASE}"
            MYSQL_USER: "${MYSQL_USER}"
            MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
        ports:
            - "${MYSQL_HOST_PORT}:${MYSQL_PORT}"
        volumes:
            - db_data:/var/lib/mysql

        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    mysql --host=127.0.0.1
                    --user="$${MYSQL_USER}"
                    --password="$${MYSQL_PASSWORD}"
                    --database="$${MYSQL_DATABASE}"
                    --execute="SELECT 1"
            interval: 5s
            start_period: 30s
    pma:
        image: phpmyadmin
        restart: always
        ports:
            - ${PMA_PORT}:80
        environment:
            - PMA_HOST=db
            - PMA_USER=root
            - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD}
        depends_on:
            db:
                condition: service_healthy
volumes:
  db_data:
