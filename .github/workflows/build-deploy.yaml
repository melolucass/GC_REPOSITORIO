name: Build and deploy
on:
    push:
        branches: [main]
    workflow_call:
jobs:
    build:
          typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7
      - name: Install Nodejs
        uses: actions/setup-node@v7
      - name: Install dependencies
        run: npm install
      - name: Run prisma generate
        run: npx prisma generate
      - name: Type checks
        run: npm run typecheck