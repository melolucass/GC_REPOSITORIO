name: Run tests
on:
  push:
    branches: [chore/test-workflow]
  pull_request:
    branches: [main]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7
      - name: Install Nodejs
        uses: actions/setup-node@v7
      - name: Install dependencies
        run: npm install
      - name: Run prisma generate
        run: npx prisma generate
      - name: Type checks
        run: npm run typecheck
  run-tests:
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Get the code
        uses: actions/checkout@v7
      - name: Install Nodejs
        uses: actions/setup-node@v7
      - name: Create environment
        run: cp .env.tests .env
      - name: Run docker compose
        run: docker compose up -d --wait db api-tests
      - name: Run tests
        run: docker compose exec -T api-tests npm test