name: Run tests
on:
  push:
    branches: [chore/test-workflow]
  pull_request:
    branches: [main]
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7
      - name: Install Nodejs
        uses: actions/setup-node@v7
      - name: Create environment
        run: cp .env.tests .env
      - name: Run docker compose
        run: docker compose up -d --wait db api-tests
      - name: Print containers
        run: docker ps